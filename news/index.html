<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>VectorScope News</title>
    <meta name="description" content="The news of the day from verified feeds in 12 countries, as stories with every perspective. No ads, no tracking." />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VS News" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body { background: #0E0E10; color: #F5F5F7; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
        font: 14px/1.5 -apple-system, system-ui, sans-serif; text-align: center; color: #A1A1A6; }
      #boot b { color: #F5F5F7; display: block; font-size: 16px; margin-bottom: 8px; }
      #boot code { color: #FF9F0A; font-size: 12px; word-break: break-word; }
    </style>
  </head>
  <body>
        <div id="boot"><div><b>◇ VectorScope</b>Starting …</div></div>
        <script>
      // Boot diagnostics: if the app has not rendered after a few seconds, say why instead of a black screen.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e.message || (e.target && (e.target.src || e.target.href)) || 'load error') + '');
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason)); });
        setTimeout(function () {
                    var boot = document.getElementById('boot');
          if (!boot) return;
          var raw = !!document.querySelector('script[src$="main.ts"]');
          boot.innerHTML = '<div><b>◇ VectorScope did not start</b>' +
            (raw
              ? 'This is the unbuilt source code. In the repository set Settings › Pages › Source to “GitHub Actions” and run the deploy workflow.'
              : 'The app failed to load. Close the page completely and open it again.') +
            (errors.length ? '<br><br><code>' + errors.slice(0, 3).join('<br>').replace(/</g, '&lt;') + '</code>' : '') +
            '</div>';
        }, 6000);
      })();
    </script>
    <div class="shield" aria-hidden="true"></div>
    <div class="app" id="app">
      <nav class="nav-side" id="navSide" aria-label="Ressorts"></nav>
      <main class="stream" id="stream"><div class="stream-inner" id="list"></div></main>
      <aside class="detail" id="detail" aria-label="Geschichte"></aside>
    </div>
    <nav class="dock" id="dock" aria-label="Ressorts">
      <div class="dock-in">
        <button class="dock-btn briefing" id="briefBtn" aria-label="2-Minuten-Überblick starten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg><span id="briefLabel">2 Min</span>
        </button>
        <div class="chips" id="chips" role="tablist"></div>
        <button class="dock-btn" id="setBtn" aria-label="Ansicht und Sprache">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>
    </nav>
    <div id="pillHost"></div>
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <div class="grip" id="grip" aria-hidden="true"></div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-bar" id="sheetBar"></div>
    </section>
    <section class="brief" id="brief" hidden aria-label="2-Minuten-Überblick"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
