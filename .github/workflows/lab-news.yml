name: Lab news feeds

# Test lab with real internet for the news module: checks the candidate feeds.
# Results only in the log and the job summary of the run, nothing is stored on GitHub.
# Only by hand (Actions, Run workflow): checks cost minutes and storage of the GitHub account.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-news
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check feeds
        run: node lab/news.mjs
      - name: Picture sizes
        run: npx tsx lab/news-images.ts
