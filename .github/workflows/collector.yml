name: Collector

# Probe collector for INTEL until PROBE_UNTIL, then it stops by itself.
# GitHub starts scheduled runs only every few hours on a quiet repository, so one run collects
# every 10 minutes for almost six hours. The hourly schedule queues the next run, which starts
# when the current one ends. Each round publishes
#   collector-data  the current data for INTEL, a single commit that is replaced every round
#   collector-raw   the raw archive, one new file per round, only grows (intel/docs/en/raw-data.md)
on:
  schedule:
    - cron: '0 * * * *'
  # Also right after a change to the collector, so new sources are collected at once.
  push:
    branches: [main]
    paths: ['collector/**', 'intel/src/data/**', '.github/workflows/collector.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  # A push brings new code: it replaces the running collection at once. Schedules wait in line.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Last day of the probe (UTC). After it the workflow does nothing.
  PROBE_UNTIL: '20270131'
  # Minutes between two rounds and how long one run keeps collecting.
  EVERY_MIN: 10
  RUN_MIN: 340

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Probe period
        id: gate
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "$PROBE_UNTIL" ]; then echo "Probe finished on $PROBE_UNTIL"; echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'yes'
      - name: Previous data
        if: steps.gate.outputs.run == 'yes'
        run: |
          mkdir -p data
          if git fetch --depth=1 origin collector-data; then
            for f in archive.json stats.json raw-state.json translations.json; do git show "FETCH_HEAD:$f" > "data/$f" 2>/dev/null || rm -f "data/$f"; done
          fi
      - name: Raw archive
        if: steps.gate.outputs.run == 'yes'
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          # Only the latest commit and no file contents: the archive is never downloaded, new files are added on top.
          if git clone -q --depth 1 --filter=blob:none --sparse --branch collector-raw "$PUSH_URL" raw; then
            echo "Raw archive found"
            git -C raw update-ref refs/vectorscope/pushed HEAD
          else
            rm -rf raw && mkdir raw && cd raw
            git init -q && git checkout -q -b collector-raw
            printf '# VectorScope raw archive\n\nWritten by the probe collector, one file per round. Format and use: intel/docs/en/raw-data.md on the main branch.\n' > README.md
            # Without raw-state.json the next round would keep the earlier archive again, so start the state fresh as well.
            rm -f ../data/raw-state.json
          fi
      - name: Collect and publish every round
        if: steps.gate.outputs.run == 'yes'
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          end=$(( $(date +%s) + RUN_MIN * 60 ))
          # The state of the last run matches the archive as pushed so far.
          if [ -f data/raw-state.json ]; then cp data/raw-state.json state-pushed.json; fi
          while :; do
            start=$(date +%s)
            if npx tsx collector/collect.ts data raw; then
              # Raw archive first. Only a state that matches the pushed archive is published, so a unit
              # can never count as known while it is missing in the archive (at worst it is stored twice).
              if (
                cd raw
                git add --sparse -A
                git -c user.name=collector -c user.email=collector@users.noreply.github.com commit -q -m "Raw $(date -u +%Y-%m-%dT%H:%MZ)"
                # The own server pushes to the same branch: on a rejected push, put the own commits on top of
                # its newest commit (only new files, never a conflict) and push again.
                if ! git push -q "$PUSH_URL" HEAD:collector-raw; then
                  git fetch -q --depth 1 --filter=blob:none "$PUSH_URL" collector-raw
                  base=refs/vectorscope/pushed
                  git rev-parse -q --verify "$base" >/dev/null || base=$(git rev-list --max-parents=0 HEAD | tail -1)
                  git -c user.name=collector -c user.email=collector@users.noreply.github.com rebase -q --onto FETCH_HEAD "$base" || { git rebase --abort; false; }
                  git push -q "$PUSH_URL" HEAD:collector-raw
                fi
                git update-ref refs/vectorscope/pushed HEAD
              ); then
                cp data/raw-state.json state-pushed.json
              else
                echo "Raw archive not pushed, the next round pushes it with its own"
              fi
              (
                rm -rf publish && cp -r data publish && cd publish
                if [ -f ../state-pushed.json ]; then cp ../state-pushed.json raw-state.json; else rm -f raw-state.json; fi
                git init -q
                git checkout -q -b collector-data
                git add -A
                git -c user.name=collector -c user.email=collector@users.noreply.github.com commit -q -m "Collector $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q -f "$PUSH_URL" collector-data
              ) || echo "Publishing failed, next round tries again"
            else
              echo "Round failed, next round tries again"
            fi
            [ "$(date -u +%Y%m%d)" -gt "$PROBE_UNTIL" ] && break
            next=$(( start + EVERY_MIN * 60 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
