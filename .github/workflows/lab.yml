name: Lab

# Test lab with real internet: real API responses and screenshots of the app with live data.
# Results are pushed to the branch "lab-results".
on:
  workflow_dispatch:
  # Once a day for the benchmark of Now, so its trend is measured even without a change.
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    # INTEL's data logic and the collector too: every change to the ranking of Now is measured.
    paths: ['air/**', 'shared/**', 'lab/**', 'proxy/**', 'intel/src/data/**', 'collector/**', '.github/workflows/lab.yml']

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Run lab
        env:
          # Optional: a read-only Cloudflare Radar token as repository secret. Empty, the lab tries without.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/serve.mjs 4173 &
          sleep 3
          node lab/run.mjs || true
          node lab/politics.mjs || true
          node lab/voices.mjs || true
          node lab/cloudflare.mjs || true
          node lab/reference.mjs || true
          LAB_SKIP_BLUESKY=1 node lab/osint.mjs || true
          npx tsx lab/qa.ts || true
          npx tsx collector/benchmark.ts https://raw.githubusercontent.com/michaeldobner/VectorScope/collector-data lab-out || true
      - name: Publish results to branch lab-results
        run: |
          cd lab-out
          git init -q
          git checkout -q -b lab-results
          git add -A
          git -c user.name=lab -c user.email=lab@users.noreply.github.com commit -q -m "Lab results ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lab-results
