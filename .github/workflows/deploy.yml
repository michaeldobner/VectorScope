name: Pages farewell

# GitHub Pages is retired: VectorScope runs on the own server (docs/en/server.md). This workflow publishes once
# a small site that forwards every old address to the same path on the server, and old service workers remove
# themselves. Runs only when this file or the redirect changes, or by hand. No npm, no build of the app.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml', 'pages-redirect/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vectorscope-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh pages-redirect/build.sh pages-out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
