name: Cleanup

# The free Actions storage of the account is 0.5 GB. Once a day, artifacts older than two days are deleted,
# the newest Pages artifact stays. Run by hand from the Actions tab to free space at once.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 3600_000;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, { ...context.repo, per_page: 100 });
            const newestPages = all.filter((a) => a.name === 'github-pages' && !a.expired).sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            let freed = 0;
            let count = 0;
            for (const a of all) {
              if (a.expired || a.id === newestPages?.id || Date.parse(a.created_at) > cutoff) continue;
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
              freed += a.size_in_bytes;
              count++;
            }
            core.info(`${all.length} artifacts, ${count} deleted, ${(freed / 1e6).toFixed(1)} MB freed`);
