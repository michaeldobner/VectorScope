name: News

# Collector of NEWS (collector/news.ts). One run collects every 10 minutes for almost six hours, the hourly
# schedule queues the next run, which starts when the current one ends. Each round publishes the edition to
# the branch news-data, a single commit that is replaced every round. The app reads news.json from there.
on:
  schedule:
    - cron: '7 * * * *'
  # Right after a change to the collector or the feeds, so the edition follows at once.
  push:
    paths: ['collector/news.ts', 'collector/embed.ts', 'news/src/data/**', '.github/workflows/news.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  # A push brings new code: it replaces the running collection at once. Schedules wait in line.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  EVERY_MIN: 10
  RUN_MIN: 340
  MODEL_DIR: ${{ github.workspace }}/.model

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The multilingual model of embed.ts, about 120 MB, downloaded once and kept.
      - uses: actions/cache@v4
        with:
          path: .model
          key: news-model-paraphrase-multilingual-MiniLM-L12-v2
      - name: Previous data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin news-data; then
            for f in news-translations.json news-og.json; do git show "FETCH_HEAD:$f" > "data/$f" 2>/dev/null || rm -f "data/$f"; done
          fi
      - name: Collect and publish every round
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          # Optional: a free DeepL API key as repository secret. Without it the public Google endpoint is asked.
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: |
          end=$(( $(date +%s) + RUN_MIN * 60 ))
          while :; do
            start=$(date +%s)
            if npx tsx collector/news.ts data; then
              (
                rm -rf publish && cp -r data publish && cd publish
                git init -q
                git checkout -q -b news-data
                git add -A
                git -c user.name=news -c user.email=news@users.noreply.github.com commit -q -m "News $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q -f "$PUSH_URL" news-data
              ) || echo "Publishing failed, next round tries again"
            else
              echo "Round failed, next round tries again"
            fi
            next=$(( start + EVERY_MIN * 60 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
