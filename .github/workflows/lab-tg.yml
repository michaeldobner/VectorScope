name: Lab Telegram channels
# Temporary: compare two Telegram channels on the work branch.
on:
  push:
    branches: [claude/tg-lab]
permissions:
  contents: read
jobs:
  tg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node lab/tg-check.mjs osintdefender DefenderDome
